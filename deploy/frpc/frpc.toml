# 机房那台的 frpc 配置
#
# 放在机房的服务器上，路径建议 /etc/frp/frpc.toml
#
# ⚠️ 把 __FRP_TOKEN__ 换成甲骨文 /etc/frp/frps.toml 里那个 token。
#    两边必须一致，否则连不上（日志里会报 token 不匹配）。

# ── 连服务端 ────────────────────────────────────────────────────────
# 走 WSS：Caddy 在甲骨文那边用 443 接收，路径 /tunnel
serverAddr = "api-orhythm.astranexus.cn"
serverPort = 443

# frpc 用 WebSocket 连，路径要和 Caddy 里的 handle /tunnel* 对上
transport.protocol = "websocket"
transport.tls.enable = true
transport.tls.serverName = "api-orhythm.astranexus.cn"

metadatas.tunnelPath = "/tunnel"

auth.method = "token"
auth.token = "__FRP_TOKEN__"

# ── 心跳（关键）──────────────────────────────────────────────────────
# 每 30 秒发一次心跳，90 秒收不到回应就判定断开并重连。
# 服务端那边的 heartbeatTimeout 也是 90，两边对齐。
transport.heartbeatInterval = 30
transport.heartbeatTimeout = 90

# 连不上时不要退出进程（否则 systemd 会当成崩溃反复拉起）
# 让它自己一直重试，配合 Restart=always 双保险
loginFailExit = false

# TCP 多路复用
transport.tcpMux = true
transport.tcpMuxKeepaliveInterval = 30

# ── 日志 ────────────────────────────────────────────────────────────
log.to = "/var/log/frpc.log"
log.level = "info"
log.maxDays = 7

# ── 要暴露的服务 ────────────────────────────────────────────────────
# 把机房本地的 8787（我们的服务端）映射成甲骨文的 127.0.0.1:8788。
# Caddy 那边把 api-orhythm.astranexus.cn 的上游指向 127.0.0.1:8788 即可。
[[proxies]]
name = "orhythm-api"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8787
remotePort = 8788

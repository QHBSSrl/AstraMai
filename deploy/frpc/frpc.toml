# 机房那台的 frpc
#
# 放在 /etc/frp/frpc.toml
# ⚠️ 把 __FRP_TOKEN__ 换成甲骨文 /etc/frp/frps.toml 里那个 token。

# ── 连服务端 ────────────────────────────────────────────────────────
# 直接连甲骨文的 IP 和已经放行的 8787，不用域名 ——
# Cloudflare 不代理 8787，走域名反而解析到 CF 的 IP 连不上。
serverAddr = "161.33.15.92"
serverPort = 8787

# 隧道本身用 TLS 加密（frps 侧 transport.tls.force = true 要求）
transport.tls.enable = true
transport.tls.serverName = "api-orhythm.astranexus.cn"

auth.method = "token"
auth.token = "__FRP_TOKEN__"

# ── 心跳（用户明确要求）──────────────────────────────────────────────
transport.heartbeatInterval = 30
transport.heartbeatTimeout = 90

# 连不上不要退出，自己一直重试；systemd 再兜一层 Restart=always
loginFailExit = false

log.to = "/var/log/frpc.log"
log.level = "info"
log.maxDays = 7

# ── 要暴露的服务 ────────────────────────────────────────────────────
# 机房本地 8787（我们的服务端）→ 甲骨文的 127.0.0.1:8788
[[proxies]]
name = "orhythm-api"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8787
remotePort = 8788

# ── 压缩 ────────────────────────────────────────────────────────────
# B50 的响应是 96 KB 的 JSON，压缩后通常只剩 10~20 KB。
#
# 跨境链路的瓶颈不是带宽而是丢包重传，**传得少就等于传得快**。
transport.useCompression = true
transport.useEncryption = true
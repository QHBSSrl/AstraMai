# frps —— 甲骨文大阪的隧道服务端
#
# ── 为什么不用 WebSocket ────────────────────────────────────────────
#
# 试过 wss（Caddy 的 /tunnel 转发到 frps:7000），frpc 报 "bad status"，
# 经 Caddy 的 WS 升级返回 502 —— 这版 frp 的服务端对 WS 升级处理不理想。
#
# 改成 frp 原生协议 + 自带 TLS，绑在**已经放行的 8787** 上：
# 不用改安全组、不用改 iptables，也不用再申请证书。
#
# ── 链路 ────────────────────────────────────────────────────────────
#
#   机房 frpc ──TLS──▶ 161.33.15.92:8787 (frps) ──▶ 映射出 127.0.0.1:8788
#                                                        ↑
#   玩家 ──HTTPS──▶ Caddy ──▶ 127.0.0.1:8788（机房里的服务端）

bindAddr = "0.0.0.0"
bindPort = 8787

# 映射出来的代理端口绑本机，只给 Caddy 用
proxyBindAddr = "127.0.0.1"

auth.method = "token"
auth.token = "__FRP_TOKEN__"

# 强制客户端用 TLS，隧道内容不在公网裸奔
transport.tls.force = true

# 心跳：90 秒收不到就回收连接
transport.heartbeatTimeout = 90
transport.tcpMux = true
transport.tcpMuxKeepaliveInterval = 30

# 只允许映射这一小段端口，别让它成为任意端口转发器
allowPorts = [
  { start = 8788, end = 8799 },
]

log.to = "/var/log/frps.log"
log.level = "info"
log.maxDays = 7